<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="924" viewBox="0 0 1440 924" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">服务端整洁架构 · 分层结构</title>
<desc id="svg-desc">同一服务进程内，接口适配位于上方，应用核心包含应用层与领域层，基础设施在核心外侧，装配入口在下方。本图没有连线，只表示职责与包含；源码依赖另图表达。</desc>
