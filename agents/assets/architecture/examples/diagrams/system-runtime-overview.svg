<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1068" viewBox="0 0 1440 1068" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">系统总览 · 运行边界与内部模块</title>
<desc id="svg-desc">虚构云端控制面部署边界与内网执行端。只有管理入口和网关标为公网入口，数据库不表示对公网暴露。控制面包含管理入口、编排模块、数据存储和网关；数据库与网关并列。两个Worker主动连接网关，在已建立通道上双向交换任务和结果。图不是源码依赖图。</desc>
<defs><marker id="arrow-9fc9f5" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#9fc9f5" stroke-width="1.7"/></marker><marker id="back-9fc9f5" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 10 2 L 2 6 L 10 10" fill="none" stroke="#9fc9f5" stroke-width="1.7"/></marker><marker id="arrow-b4c2ce" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#b4c2ce" stroke-width="1.7"/></marker><marker id="back-b4c2ce" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 10 2 L 2 6 L 10 10" fill="none" stroke="#b4c2ce" stroke-width="1.7"/></marker><marker id="arrow-b5d8c3" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#b5d8c3" stroke-width="1.7"/></marker><marker id="back-b5d8c3" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 10 2 L 2 6 L 10 10" fill="none" stroke="#b5d8c3" stroke-width="1.7"/></marker><marker id="arrow-cfbfdf" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#cfbfdf" stroke-width="1.7"/></marker><marker id="back-cfbfdf" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 10 2 L 2 6 L 10 10" fill="none" stroke="#cfbfdf" stroke-width="1.7"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}rect,path{vector-effect:non-scaling-stroke}</style>
<rect id="canvas" x="0" y="0" width="1440" height="1068" rx="0" fill="#15191d" stroke="none"/>
<text id="heading" x="32" y="49" font-size="32" font-weight="600" fill="#edf3f8" text-anchor="start">系统总览 · 运行边界与内部模块</text>
<text id="context" x="32" y="82" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="start">虚构目标示例 · 不代表项目现状 · 采用时替换为真实模块与源码依据</text>
<rect id="control-plane" x="24" y="110" width="1392" height="564" rx="22" fill="#1b232a" stroke="#3b4a59"/><text id="control-plane-title" x="48" y="151" font-size="28" font-weight="600" fill="#edf3f8" text-anchor="start">云端 · Control Plane（部署范围）</text><text id="control-plane-host" x="1388" y="151" font-size="22" font-weight="400" fill="#b4c2ce" text-anchor="end">VPS / Cloud</text><rect id="web" x="48" y="174" width="1344" height="90" rx="14" fill="#242d35" stroke="none"/><text id="web-title" x="720" y="212" font-size="27" font-weight="500" fill="#edf3f8" text-anchor="middle">Web Dashboard / REST API</text><text id="web-detail" x="720" y="245" font-size="21" font-weight="400" fill="#b4c2ce" text-anchor="middle">公网管理入口 · HTTPS</text><rect id="orchestrator" x="48" y="304" width="1344" height="212" rx="14" fill="#242d35" stroke="none"/><text id="orchestrator-title" x="720" y="341" font-size="26" font-weight="500" fill="#edf3f8" text-anchor="middle">Global Orchestrator · 同一进程内逻辑模块</text><rect id="coordinator-box" x="68" y="362" width="636" height="56" rx="14" fill="#111a22" stroke="none"/><text id="coordinator-name" x="386.0" y="398.0" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">AI Coordinator · 协调任务</text><rect id="workflow-box" x="720" y="362" width="652" height="56" rx="14" fill="#111a22" stroke="none"/><text id="workflow-name" x="1046.0" y="398.0" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">Workflow Engine · 编排步骤</text><rect id="scheduler-box" x="68" y="434" width="636" height="56" rx="14" fill="#111a22" stroke="none"/><text id="scheduler-name" x="386.0" y="470.0" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">Task Scheduler · 分配执行端</text><rect id="registry-box" x="720" y="434" width="652" height="56" rx="14" fill="#111a22" stroke="none"/><text id="registry-name" x="1046.0" y="470.0" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">Worker Registry · 在线执行端</text><rect id="database" x="68" y="566" width="610" height="82" rx="14" fill="#242d35" stroke="none"/><text id="database-title" x="373" y="603" font-size="26" font-weight="500" fill="#edf3f8" text-anchor="middle">PostgreSQL / Event Store</text><text id="database-detail" x="373" y="633" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="middle">任务与事件持久化</text><rect id="gateway" x="770" y="566" width="602" height="82" rx="14" fill="#242d35" stroke="none"/><text id="gateway-title" x="1071" y="603" font-size="26" font-weight="500" fill="#edf3f8" text-anchor="middle">Worker Gateway</text><text id="gateway-detail" x="1071" y="633" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="middle">公网 WSS / HTTPS · 连接与消息路由</text><path id="web-to-orchestrator" d="M 720 264 V 304" fill="none" stroke="#b4c2ce" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-b4c2ce)"/><text id="web-operation" x="744" y="290" font-size="19" font-weight="400" fill="#b4c2ce" text-anchor="start">提交 / 查询任务</text><path id="orchestrator-to-database" d="M 373 516 V 566" fill="none" stroke="#b4c2ce" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-b4c2ce)"/><text id="db-operation" x="398" y="549" font-size="19" font-weight="400" fill="#b4c2ce" text-anchor="start">读写任务与事件</text><path id="orchestrator-to-gateway" d="M 1071 516 V 566" fill="none" stroke="#b4c2ce" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-b4c2ce)" marker-start="url(#back-b4c2ce)"/><text id="gateway-operation" x="1096" y="549" font-size="19" font-weight="400" fill="#b4c2ce" text-anchor="start">派发请求 / 转交结果</text><text id="channel-title" x="48" y="714" font-size="23" font-weight="500" fill="#9fc9f5" text-anchor="start">WSS / TLS · Worker 主动建立连接</text><text id="channel-note" x="48" y="744" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="start">复用通道派发任务与上报结果；不要求内网开放入站端口。</text><rect id="worker-host-a" x="24" y="798" width="680" height="200" rx="22" fill="#1b232a" stroke="#3b4a59"/><text id="host-a-title" x="48" y="834" font-size="25" font-weight="500" fill="#edf3f8" text-anchor="start">内网执行主机 A</text><text id="host-a-os" x="48" y="862" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="start">macOS / Windows</text><rect id="worker-a-box" x="48" y="890" width="632" height="82" rx="14" fill="#111a22" stroke="none"/><text id="worker-a-name" x="364.0" y="922" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">Worker Daemon</text><text id="worker-a-detail" x="364.0" y="950" font-size="19" font-weight="400" fill="#b4c2ce" text-anchor="middle">连接 / 执行 / 本机资源</text><rect id="worker-host-b" x="728" y="798" width="688" height="200" rx="22" fill="#1b232a" stroke="#3b4a59"/><text id="host-b-title" x="752" y="834" font-size="25" font-weight="500" fill="#edf3f8" text-anchor="start">内网执行主机 B</text><text id="host-b-os" x="752" y="862" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="start">Linux / Docker</text><rect id="worker-b-box" x="752" y="890" width="640" height="82" rx="14" fill="#111a22" stroke="none"/><text id="worker-b-name" x="1072.0" y="922" font-size="23" font-weight="500" fill="#edf3f8" text-anchor="middle">Worker Daemon</text><text id="worker-b-detail" x="1072.0" y="950" font-size="19" font-weight="400" fill="#b4c2ce" text-anchor="middle">连接 / 执行 / 本机资源</text><path id="worker-a-connection" d="M 364 890 V 772 H 1036 V 648" fill="none" stroke="#9fc9f5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-9fc9f5)"/><path id="worker-b-connection" d="M 1072 890 V 784 H 1160 V 648" fill="none" stroke="#9fc9f5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-9fc9f5)"/><text id="structure-legend" x="32" y="1036" font-size="20" font-weight="400" fill="#b4c2ce" text-anchor="start">蓝色箭头 = 主动建连；灰色箭头 = 运行调用 / 数据访问。TLS 加密不等于双向身份认证。</text>
</svg>
